
spring:
  application:
    name: huerta-service

  datasource:
    url: jdbc:mariadb://localhost:3306/huerta_cultivos
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

logging:
  level:
    org.hibernate.SQL: DEBUG


app:
  jwt:
    issuer: huerta-escolar
    secret: ${JWT_SECRET}

