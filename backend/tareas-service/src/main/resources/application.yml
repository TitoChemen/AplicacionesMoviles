
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  application:
    name: tareas-service

  datasource:
    url: jdbc:mariadb://localhost:3306/huerta_tareas
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083

app:
  archivos:
    directorio: ${EVIDENCIAS_DIR:./uploads/evidencias}
  jwt:
    issuer: huerta-escolar
    secret: ${JWT_SECRET}
