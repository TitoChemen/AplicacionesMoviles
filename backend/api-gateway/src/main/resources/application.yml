
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/usuarios/**

            - id: huerta-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/sectores/**,/api/cultivos/**

            - id: tareas-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/tareas/**,/api/alertas/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
